category: "Branding & Illustration"

overview: >
  Kikyo takes its name from the Japanese bellflower — a symbol of honesty and
  unchanging love. The client wanted a visual identity and menu system that held
  that meaning quietly: no decorative excess, no loud colour, just assured form.
  We developed the full brand identity and a hand-illustrated print menu across
  dine-in and takeaway formats.

challenge: >
  The brief called for contemporary Japanese dining to feel genuinely at home in
  Kuala Lumpur without diluting its cultural grounding. Too much localisation and
  it loses credibility; too much reverence and it feels cold and unapproachable.
  The real challenge was signalling authenticity through restraint.

approach: >
  We anchored the system in a single illustrative mark — an abstracted bellflower
  rendered in fine ink line — and built the entire identity outward from that
  point. Typography was set in a Japanese-adjacent geometric serif with high
  contrast and generous spacing. The menu held to a strict two-colour palette
  (deep charcoal and cream) so the illustration could carry all the warmth.

