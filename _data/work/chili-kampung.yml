overview: >
  Chili Kampung is a food brand rooted in kampung tradition — bold flavours,
  family recipes, the kind of cooking that people actually miss. The identity had
  to match that energy: vivid, unpretentious, and instantly recognisable on a
  market shelf. We developed the brand system and full print menu across all
  product formats.

challenge: >
  Malaysian food brands often face a fork in the road: go modern and clinical,
  or lean into heritage and risk looking dated. Chili Kampung needed to feel
  proudly local and deeply rooted without reading as nostalgic kitsch. The brief
  asked for something that could stand confidently alongside both artisan and
  mass-market competitors.

approach: >
  We built the identity around a bold illustrative system — strong outlines,
  saturated colour, and hand-drawn character that referenced kampung graphic
  traditions without copying them. The illustration style gave the brand an
  irreplaceable visual fingerprint. The menu and packaging system were designed
  to carry maximum impact at small scale, ensuring the brand punched well above
  its size on crowded shelves and tables.

