about:
  title: "We build with intention."
  description: "CHIJO is a digital product studio based in Kuala Lumpur. We partner with brands and founders to design and build things that last."
  story:
    label: "Our story"
    heading: "Small studio, big conviction."
    body_1: "We started CHIJO with a simple belief: good design and solid engineering shouldn't be a tradeoff. Too often, brands choose between beautiful and functional. We think you deserve both."
    body_2: "From branding to full web apps, we take every project personally. We're a small, focused studio — which means the people you talk to are the people who do the work."
  values:
    label: "How we work"
    heading: "What we value."
    items:
      - number: "01"
        title: "Quality"
        description: "We don't rush. Every detail is considered, every line of code intentional. Quality isn't a feature — it's the baseline."
      - number: "02"
        title: "Communication"
        description: "You'll always know where things stand. We keep you in the loop at every stage — no surprises, no chasing for updates."
      - number: "03"
        title: "Transparency"
        description: "Honest scoping, clear timelines, and straightforward feedback. We say what we mean and mean what we say."
      - number: "04"
        title: "No ASAP culture"
        description: "Urgency should mean something. We don't manufacture pressure — we plan well so that rushed decisions and last-minute panics don't become the norm."
      - number: "05"
        title: "Small by design"
        description: "We stay small deliberately. Small teams mean less overhead, tighter communication, and people who genuinely care about the outcome — not just the hours billed."
      - number: "06"
        title: "Ownership"
        description: "We treat your project like our own. That means speaking up when something isn't right, not just delivering what was asked."
      - number: "07"
        title: "Longevity"
        description: "We build things to last. Not the quickest path to done, but the one that holds up six months after launch when you're not watching."
  process:
    heading: "Our process."
    steps:
      - title: "Discovery"
        description: "We start by understanding your business, your users, and the problem we're solving together. No assumptions — just good questions."
      - title: "Concept"
        description: "We sketch direction before we commit to detail. You see the shape of the solution early, when changes are cheap and feedback is most useful."
      - title: "Build"
        description: "Design and development happen in close rhythm. We work in short cycles so you can see progress and steer as we go."
      - title: "Refine"
        description: "We test, tighten, and polish. The last 10% is where good work becomes work you're proud of."
      - title: "Launch"
        description: "We ship carefully. After launch, we stay close — making sure everything holds and you know how to take it forward."
  cta:
    label: "Start a project"
    heading: "Have something in mind?"
    body: "We're always open to new collaborations. Tell us about your project and let's see if we're a good fit."
    button: "Get in touch"
    url: "/contact"