<header>
  <div class="container mx-auto{% unless include.center == false %} text-center{% endunless %}">
    <h1 class="h1 max-w-3xl{% unless include.center == false %} mx-auto{% endunless %}" data-animate>{{ include.title }}</h1>
    <p class="mt-8 text-xl font-sans text-pretty text-secondary sm:text-2xl leading-relaxed max-w-2xl{% unless include.center == false %} mx-auto{% endunless %}" data-animate>{{ include.content }}</p>
  </div>
</header>
