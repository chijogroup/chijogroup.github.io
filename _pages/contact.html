---
title: Contact
layout: default
permalink: /contact
---


<section class="px-6 pt-24 pb-16 sm:pt-32 sm:pb-20 lg:px-8">
  <div class="container mx-auto">

    <div class="flex flex-col gap-4 max-w-4xl">
      <div>
        <p class="text-xs uppercase tracking-widest text-olive-600 dark:text-olive-400 mb-2" data-animate>Get in touch</p>
        <h1 class="hero-title" data-animate>{{ site.data.content.contact.title }}</h1>
        <p class="mt-6 text-xl text-olive-700 dark:text-gray-400 leading-relaxed" data-animate>{{ site.data.content.contact.description }}</p>
      </div>

      <div class="pt-4" data-animate>
        <p class="text-xs uppercase tracking-widest text-olive-500 dark:text-olive-500 mb-3">Or email us directly</p>
        <a href="mailto:hello@chijo.my" class="text-lg font-medium text-olive-950 dark:text-white hover:text-olive-600 dark:hover:text-olive-400 transition-colors">
          hello@chijo.my
        </a>
      </div>
    </div>

    <div data-animate class="max-w-4xl mt-16">
      <form action="http://localhost:3000/f/019f03a4-b2d9-776d-a5c3-2451ab41e408" method="POST">
        <div class="grid grid-cols-1 gap-x-8 gap-y-8 sm:grid-cols-2">

          <div>
            <label for="first-name" class="form-label">First name</label>
            <input id="first-name" type="text" name="first-name" autocomplete="given-name" class="form-input" />
          </div>

          <div>
            <label for="last-name" class="form-label">Last name</label>
            <input id="last-name" type="text" name="last-name" autocomplete="family-name" class="form-input" />
          </div>

          <div class="sm:col-span-2">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" name="email" autocomplete="email" class="form-input" />
          </div>

          <div class="sm:col-span-2">
            <label for="company" class="form-label">Company</label>
            <input id="company" type="text" name="company" autocomplete="organization" class="form-input" />
          </div>

          <div class="sm:col-span-2">
            <div class="flex justify-between items-baseline mb-2">
              <label for="phone" class="form-label mb-0">Phone</label>
              <span class="text-sm text-olive-400 dark:text-gray-500">Optional</span>
            </div>
            <input id="phone" type="tel" name="phone" autocomplete="tel" class="form-input" />
          </div>

          <div class="sm:col-span-2">
            <div class="flex justify-between items-baseline mb-2">
              <label for="message" class="form-label mb-0">How can we help you?</label>
              <span class="text-sm text-olive-400 dark:text-gray-500">Max 500 characters</span>
            </div>
            <textarea id="message" name="message" rows="5" maxlength="500" class="form-input"></textarea>
          </div>

          <fieldset class="sm:col-span-2">
            <legend class="form-label">Expected budget</legend>
            <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4">
              <label class="budget-card">
                <input type="radio" name="budget" value="under_25k" class="sr-only" checked />
                Less than $25K
              </label>
              <label class="budget-card">
                <input type="radio" name="budget" value="25k-50k" class="sr-only" />
                $25K – $50K
              </label>
              <label class="budget-card">
                <input type="radio" name="budget" value="50k-100k" class="sr-only" />
                $50K – $100K
              </label>
              <label class="budget-card">
                <input type="radio" name="budget" value="over_100k" class="sr-only" />
                $100K+
              </label>
            </div>
          </fieldset>

          <div class="sm:col-span-2 pt-2">
            <button type="submit" class="btn btn-primary w-full sm:w-auto">Send message</button>
          </div>

        </div>
      </form>
    </div>

  </div>
</section>
